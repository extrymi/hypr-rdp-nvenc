name: Fixture generation

# Produces test fixtures on a disposable runner (never on a workstation). The
# outputs are committed to the runtime branch with their provenance.
on:
  push:
    branches: [impl/r1-evidence]
    paths: ['ci/fixtures/**', '.github/workflows/fixtures.yml']

permissions:
  contents: read

jobs:
  cabac:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout fixture scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install FFmpeg with libx264 on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Generate and cross-decode CABAC fixtures (VALIDATION-PLAN B3-2)
        run: bash ci/fixtures/make-cabac.sh artifacts

      - name: Upload fixtures and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cabac-fixtures-${{ github.sha }}
          path: artifacts/
