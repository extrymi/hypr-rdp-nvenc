name: CPU baseline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/cpu-baseline, codex/nvenc-lifecycle, codex/startup-validation]

permissions:
  contents: read

concurrency:
  group: cpu-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.99.1"
  RUST_TEST_THREADS: "2"
  PROPTEST_CASES: "512"

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout proposed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify source and toolchain pins
        run: |
          mkdir -p artifacts
          python3 scripts/ci/verify-baseline.py | tee artifacts/baseline-verification.log
          python3 scripts/ci/verify-nvenc-headers.py | tee artifacts/nvenc-headers.log

      - name: Install dependencies on disposable runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake pkg-config libclang-dev libpipewire-0.3-dev libva-dev libxkbcommon-dev libwayland-dev libgbm-dev libpam0g-dev fuse3

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt --target x86_64-unknown-linux-gnu

      - name: Record compiler and system provenance
        run: python3 scripts/ci/record-environment.py

      - name: Fetch locked dependencies
        run: |
          cargo fetch --locked
          cargo metadata --frozen --format-version 1 > artifacts/cargo-metadata.json

      - name: Check formatting
        run: |
          if ! cargo fmt --all -- --check > artifacts/fmt.log 2>&1; then
            cat artifacts/fmt.log
            cargo fmt --all
            git diff --no-color > artifacts/rustfmt.patch
            echo HYPR_RUSTFMT_PATCH_BEGIN
            cat artifacts/rustfmt.patch
            echo HYPR_RUSTFMT_PATCH_END
            exit 1
          fi

      - name: Clippy all targets and existing features
        run: cargo clippy --frozen --all-targets --all-features -- -D warnings 2>&1 | tee artifacts/clippy.log

      - name: Test generated native ABI and independent CPU driver API
        run: |
          cargo test --frozen --features nvenc --lib 2>&1 | tee artifacts/test-native.log
          cargo test --frozen --no-default-features --features nvenc --lib 2>&1 | tee artifacts/test-native-software.log

      - name: Test NVENC lifecycle with concurrent process creation
        run: |
          cargo test --frozen --lib 2>&1 | tee artifacts/test-nvenc-core.log
          for attempt in 1 2 3 4 5; do
            cargo test --frozen --test nvenc_worker -- --test-threads=4 2>&1 | tee "artifacts/test-nvenc-worker-${attempt}.log"
          done

      - name: Check startup without desktop access
        run: cargo test --frozen --test startup 2>&1 | tee artifacts/test-startup.log

      - name: Test default features
        run: cargo test --frozen 2>&1 | tee artifacts/test-default.log

      - name: Check dormant subprocess fixtures
        run: cargo test --frozen --test nvenc_worker -- --ignored 2>&1 | tee artifacts/test-dormant-fixtures.log

      - name: Test software-only features
        run: cargo test --frozen --no-default-features 2>&1 | tee artifacts/test-software.log

      - name: Test software with inbound file clipboard
        run: cargo test --frozen --no-default-features --features client-to-server 2>&1 | tee artifacts/test-software-clipboard.log

      - name: Check FUSE byte transfer on disposable runner
        run: |
          sudo modprobe fuse
          cargo test --frozen --no-default-features --features client-to-server inbound_real_mount_copy_bytes -- --ignored --test-threads=1 2>&1 | tee artifacts/test-fuse.log

      - name: Build frozen release baseline
        run: |
          cargo build --frozen --release --features nvenc 2>&1 | tee artifacts/build-release.log
          nm target/release/hypr-rdp > artifacts/release-symbols.txt
          if grep 'hypr_mock_' artifacts/release-symbols.txt; then
            echo "CPU test driver fixture linked into production executable"
            exit 1
          fi

      - name: Package baseline evidence
        run: bash scripts/ci/create-artifact.sh

      - name: Upload CPU baseline and evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-baseline-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
